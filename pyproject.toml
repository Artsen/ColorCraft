[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["backend/.venv", "backend/.venv311"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008", "B905", "E741"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "backend/(\\.venv|\\.venv311)/"
